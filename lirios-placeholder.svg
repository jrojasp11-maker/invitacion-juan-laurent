<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Placeholder para lirios.png - REEMPLAZAR CON IMAGEN REAL -->
  <rect width="800" height="600" fill="#fdfbf7"/>
  
  <!-- Fondo sutil degradado -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fefdf8"/>
      <stop offset="100%" stop-color="#f5f0e8"/>
    </linearGradient>
    <radialGradient id="glow" cx="400" cy="300" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d4a574" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#d4a574" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <ellipse cx="400" cy="300" rx="350" ry="250" fill="url(#glow)"/>
  
  <!-- Texto decorativo -->
  <text x="400" y="270" font-family="Georgia, serif" font-size="48" font-weight="400" fill="#c0392b" text-anchor="middle" opacity="0.6">🌸</text>
  <text x="400" y="340" font-family="'Dancing Script', cursive" font-size="32" fill="#8b2518" text-anchor="middle" font-weight="600">Lirios Landini</text>
  <text x="400" y="380" font-family="Inter, sans-serif" font-size="16" fill="#8b8b8b" text-anchor="middle" opacity="0.7">Reemplaza este SVG con <code>lirios.png</code> real</text>
  
  <!-- Detalles florales decorativos -->
  <g fill="#e8b4a0" opacity="0.3">
    <ellipse cx="200" cy="150" rx="30" ry="50" transform="rotate(-30 200 150)"/>
    <ellipse cx="600" cy="150" rx="30" ry="50" transform="rotate(30 600 150)"/>
    <ellipse cx="180" cy="450" rx="25" ry="45" transform="rotate(20 180 450)"/>
    <ellipse cx="620" cy="450" rx="25" ry="45" transform="rotate(-20 620 450)"/>
  </g>
  
  <g fill="#f5c6a5" opacity="0.4">
    <ellipse cx="350" cy="200" rx="20" ry="40" transform="rotate(-15 350 200)"/>
    <ellipse cx="450" cy="200" rx="20" ry="40" transform="rotate(15 450 200)"/>
    <ellipse cx="330" cy="400" rx="18" ry="38" transform="rotate(10 330 400)"/>
    <ellipse cx="470" cy="400" rx="18" ry="38" transform="rotate(-10 470 400)"/>
  </g>
  
  <!-- Centro: representación abstracta de ramo -->
  <g transform="translate(400, 320)">
    <!-- Tallos -->
    <g stroke="#8a9a5b" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M-60 60 Q-60 0 -40 -40" opacity="0.5"/>
      <path d="M0 60 Q0 0 0 -50" opacity="0.5"/>
      <path d="M60 60 Q60 0 40 -40" opacity="0.5"/>
      <path d="M-30 60 Q-30 0 -20 -30" opacity="0.4"/>
      <path d="M30 60 Q30 0 20 -30" opacity="0.4"/>
    </g>
    
    <!-- Flores -->
    <g fill="#ffb6c1" opacity="0.6">
      <ellipse cx="-50" cy="-50" rx="22" ry="18" transform="rotate(-20 -50 -50)"/>
      <ellipse cx="0" cy="-60" rx="24" ry="20"/>
      <ellipse cx="50" cy="-50" rx="22" ry="18" transform="rotate(20 50 -50)"/>
      <ellipse cx="-25" cy="-20" rx="18" ry="15" transform="rotate(-10 -25 -20)"/>
      <ellipse cx="25" cy="-20" rx="18" ry="15" transform="rotate(10 25 -20)"/>
    </g>
    
    <g fill="#fff0f5" opacity="0.8">
      <ellipse cx="-50" cy="-50" rx="14" ry="11" transform="rotate(-20 -50 -50)"/>
      <ellipse cx="0" cy="-60" rx="16" ry="13"/>
      <ellipse cx="50" cy="-50" rx="14" ry="11" transform="rotate(20 50 -50)"/>
    </g>
    
    <!-- Estambres -->
    <g fill="#d4a574" opacity="0.7">
      <circle cx="-50" cy="-50" r="3"/>
      <circle cx="0" cy="-60" r="3"/>
      <circle cx="50" cy="-50" r="3"/>
    </g>
  </g>
</svg>